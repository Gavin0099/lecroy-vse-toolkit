name: Governance Drift

# Disabled for automatic triggers on 2026-09-14 (owner decision, G0 lightweight maintenance).
# The job calls governance/governance_tools/governance_drift_checker.py, which was never
# vendored into this repository: all five runs since adoption failed with
# "can't open file ... [Errno 2]" and never evaluated drift. Keep manual dispatch only;
# restore push/pull_request triggers after a pinned checker is vendored. See PLAN.md G0.
on:
  workflow_dispatch:

jobs:
  governance-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run governance drift check
        run: |
          python governance/governance_tools/governance_drift_checker.py \
            --repo . \
            --framework-root governance \
            --format human
